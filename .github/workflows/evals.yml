name: evals
# Регресия на evals (виж plugins/fire-service/evals/README.md): пуска случаите с таг `regresiya`
# и ги сравнява с evals/baseline.json. Струва пари (~12 USD на пускане: 28 случая по 3 опита, ~5 мин), затова
# върви САМО РЪЧНО (Actions → evals → Run workflow, или `gh workflow run evals.yml`) – след промени в описанията
# или в SKILL.md и преди нова версия за потребителите. Без секрета ANTHROPIC_API_KEY работата се пропуска.
# С `sluchai` (напр. `gh workflow run evals.yml -f sluchai=eptz-zaklyuchenie-nepalni-materiali`) върви само този
# случай (или шаблон с *), без сравнение с базата – за нов или поправен случай (~1 USD за ЕПТЗ случай).
on:
  workflow_dispatch:
    inputs:
      sluchai:
        description: "Само тези случаи (име или шаблон с *); празно = регресията"
        required: false
        default: ""
jobs:
  evals:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Has the API key?
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::No ANTHROPIC_API_KEY secret – evals skipped."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-python@v7
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: "22"
      - name: Install
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces (AppArmor) – without this every Bash call of the
          # eval sandbox stops with "apply-seccomp: write /proc/self/setgroups … Permission denied"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          pip install -r requirements-dev.txt
          npm install -g @anthropic-ai/claude-code
      - name: Run the chosen cases
        if: steps.key.outputs.ok == 'true' && inputs.sluchai != ''
        working-directory: plugins/fire-service
        env:
          SLUCHAI: ${{ inputs.sluchai }}
        run: |
          mkdir -p evals/results
          claude plugin eval . --case "$SLUCHAI" --ablation none --trust-plugin --no-publish \
            --allow-tools Bash Write Edit -j 2 --max-cost-usd 5 --threshold 0 --keep-temp \
            --json evals/results/ci.json --report evals/results/report.html || true
          # the transcripts and the files each run wrote – to see why a grader failed
          for d in /tmp/claude-eval-*/; do n=$(basename "$d"); mkdir -p "evals/results/$n"
            for sub in out work; do [ -d "$d$sub" ] && cp -r "$d$sub" "evals/results/$n/" 2>/dev/null || true; done; done
          chmod -R u+rwX evals/results || true
      - name: Run the regression cases
        if: steps.key.outputs.ok == 'true' && inputs.sluchai == ''
        working-directory: plugins/fire-service
        run: |
          mkdir -p evals/results
          claude plugin eval . --tag regresiya --ablation none --trust-plugin --no-publish \
            --allow-tools Bash -j 4 --max-cost-usd 12 --threshold 0 \
            --json evals/results/ci.json --report evals/results/report.html
      - name: Compare with the baseline
        if: steps.key.outputs.ok == 'true' && inputs.sluchai == ''
        working-directory: plugins/fire-service
        run: python3 evals/regresiya.py evals/results/ci.json --bez-istoriya
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.ok == 'true'
        with:
          name: eval-report
          path: plugins/fire-service/evals/results/
