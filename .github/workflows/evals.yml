name: evals
# Регресия на evals (виж plugins/fire-service/evals/README.md): пуска случаите с таг `regresiya`
# и ги сравнява с evals/baseline.json. Струва пари (~12 USD на пускане: 28 случая по 3 опита, ~5 мин), затова
# върви САМО РЪЧНО (Actions → evals → Run workflow, или `gh workflow run evals.yml`) – след промени в описанията
# или в SKILL.md и преди нова версия за потребителите. Без секрета ANTHROPIC_API_KEY работата се пропуска.
on:
  workflow_dispatch:
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Has the API key?
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::No ANTHROPIC_API_KEY secret – evals skipped."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-python@v7
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: "22"
      - name: Install
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap socat
          pip install -r requirements-dev.txt
          npm install -g @anthropic-ai/claude-code
      - name: Run the regression cases
        if: steps.key.outputs.ok == 'true'
        working-directory: plugins/fire-service
        run: |
          mkdir -p evals/results
          claude plugin eval . --tag regresiya --ablation none --trust-plugin --no-publish \
            --allow-tools Bash -j 4 --max-cost-usd 12 --threshold 0 \
            --json evals/results/ci.json --report evals/results/report.html
      - name: Compare with the baseline
        if: steps.key.outputs.ok == 'true'
        working-directory: plugins/fire-service
        run: python3 evals/regresiya.py evals/results/ci.json --bez-istoriya
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.ok == 'true'
        with:
          name: eval-report
          path: plugins/fire-service/evals/results/
