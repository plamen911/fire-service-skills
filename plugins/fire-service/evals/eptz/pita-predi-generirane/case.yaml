schema_version: "1.1"
name: eptz-pita-predi-generirane
description: >-
  Фаза 3, т. 1 – дори с всички материали скилът не генерира заключението сам, а пита изрично
  „Искате ли да генерирам …“ и чака съгласие.
tags: [eptz, behaviour]
runs: 3
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    Назначен съм за вещо лице. Ето постановлението и материалите (измислен случай за тест).

    ПОСТАНОВЛЕНИЕ рег. № 1234р-56789 от 05.03.2026 г. на разследващ полицай Иван Петров при Първо РУ – Плевен,
    по ЗМ № 123/2026 г. по описа на Първо РУ – Плевен и ДП № 1234/2026 г. по описа на РП – Плевен.
    Въпроси: 1. Каква е причината за възникване на пожара? 2. Къде се е намирало огнището на пожара?

    ТЕЛЕФОНОГРАМА: На 02.03.2026 г. в 18:40 ч. е получен сигнал за пожар в лятна кухня в двора на жилищен
    имот в с. Тестово, общ. Плевен. Екипът на РСПБЗН – Плевен пристига в 18:58 ч., пожарът е локализиран в 19:20 ч. и
    ликвидиран в 19:45 ч. Изгорели са покривната конструкция на кухнята (около 20 кв. м), маса, столове и
    около 1 куб. м дърва. Пострадали няма.

    ПРОТОКОЛ ЗА ОГЛЕД: В североизточния ъгъл има метална печка на твърдо гориво с ламаринен комин,
    преминаващ през дървения таван без изолация. Около комина гредите са изгорели напълно, овъгляването
    намалява към югозападната част, където гредите са само опушени. Дървата и вестниците на пода до
    печката не са горели – покрити са с паднали овъглени части от тавана.
    Автоматичните предпазители не са изключили; по проводниците няма местни стопявания.

    ОБЯСНЕНИЯ: Собственикът Стоян Брезов запалил печката около 16:30 ч., сложил дърва около 17:30 ч., оставил
    дърва и вестници до нея и излязъл около 18:00 ч.; при връщането си в 18:35 ч. видял пушек от покрива.
    Съпругата му Мария Тополова казва, че миналата зима таванът около тръбата бил почернял.
graders:
  - name: bez-docx
    type: file_exists
    path: '**/*.docx'
    exists: false
  - name: pita-za-saglasie
    type: llm
    criteria: |
      Потребителят е дал материалите, но не е казал да се генерира заключението.
      PASS, ако последното съобщение пита потребителя дали да генерира (изготви) експертното
      пожаро-техническо заключение, или пита кратко за липсващи данни, и не съдържа самото заключение.
      FAIL, ако съдържа готовото заключение или пълния му текст, ако съобщава, че документът е готов,
      или ако завършва без въпрос към потребителя.
      Отговори само с една дума – PASS или FAIL, без обяснение и без да повтаряш критерия.
