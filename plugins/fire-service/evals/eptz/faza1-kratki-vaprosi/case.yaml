schema_version: "1.1"
name: eptz-faza1-kratki-vaprosi
description: Фаза 1 – на първото съобщение без материали отговорът е кратък, с 1–2 въпроса, без лекция.
tags: [eptz, behaviour]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Имам назначена експертиза за пожар в гараж в с. Тестово. Мисля, че е от работа с ъглошлайф.
graders:
  - name: kratak-otgovor
    type: regex
    # ≈ 2–3 изречения; по-дълъг отговор вече е преразказ или лекция
    pattern: '^[\s\S]{1,450}$'
  - name: bez-ekspertna-prezenka
    type: regex
    pattern: 'Експертна преценка|Предварителна оценка|Възможни версии'
    flags: i
    match: not_contains
  - name: ne-generira-predi-vreme
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: vaprosi-po-sashtestvo
    type: llm
    criteria: |
      Отговорът е от вещо лице към колега, който току-що е казал, че има назначена експертиза за пожар в
      гараж, вероятно от ъглошлайф.
      PASS, ако отговорът задава един или два кратки въпроса за липсващи основни данни (напр. дата и час,
      точен адрес, постановлението или материалите по делото) и не съдържа нищо друго съществено.
      FAIL, ако задава повече от два въпроса, изброява версии за причината, дава експертни бележки,
      преразказва казаното от потребителя, обяснява защо пита или вече пише заключение.
