schema_version: "1.1"
name: eptz-trigger-smetka
description: Искане само за сметката за експертиза – и тя е в eptz.
tags: [eptz, trigger, regresiya]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Трябва ми сметката за експертизата по ЗМ № 123/2026 г. – заключението стана 6 страници, в два екземпляра.
graders:
  - name: zarezhda-eptz
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eptz"'
