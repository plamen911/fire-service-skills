schema_version: "1.1"
name: eptz-trigger-postanovlenie
description: Постановление за назначаване на СПТЕ, без думата „ЕПТЗ“ – трябва да се зареди eptz.
tags: [eptz, trigger, regresiya]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Назначиха ме за вещо лице. Постановлението е по ЗМ № 123/2026 г. по описа на Първо РУ – Плевен
    и ДП № 1234/2026 г. по описа на РП – Плевен. Въпросите са: каква е причината за пожара в лятната
    кухня и къде е било огнището. Можеш ли да ми помогнеш с отговорите?
graders:
  - name: zarezhda-eptz
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eptz"'
  - name: ne-zarezhda-spravka
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spravka-prichina"'
    min: 0
    max: 0
