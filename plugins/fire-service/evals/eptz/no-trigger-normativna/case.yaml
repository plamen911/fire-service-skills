schema_version: "1.1"
name: eptz-no-trigger-normativna
description: Въпрос за текста на акт, в който се споменава експертиза – това е normativna-uredba, не eptz.
tags: [eptz, trigger]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Какво гласи чл. 23, ал. 3 от Наредба № Н-1 от 2023 г. за възнагражденията на вещите лица?
graders:
  - name: ne-zarezhda-eptz
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eptz"'
    min: 0
    max: 0
