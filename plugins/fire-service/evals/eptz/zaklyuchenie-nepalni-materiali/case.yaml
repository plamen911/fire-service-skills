schema_version: "1.1"
name: eptz-zaklyuchenie-nepalni-materiali
description: >-
  ЕПТЗ за два пожара в сухи треви и гора без протокол за оглед и без веществени доказателства. Взет от
  истинска грешка (имената и местата са измислени): с безплатния план моделът написа писмо за отказ
  вместо заключение. Очаква се заключение по наличните материали, с отговор на всеки въпрос и с
  изрично казано какво не може да се установи.
tags: [eptz, output]
runs: 1
execution:
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
  prompt: |
    Назначен съм за вещо лице. Измислен случай за тест – генерирай заключението направо, съгласен съм,
    не питай. Освен .docx запиши текста на заключението и в report.md в текущата папка.

    Експерт: Тодор Ясенов, ИНСПЕКТОР, инспектор в група „ОЦ“ на сектор „ПГ и СД“ при РДПБЗН – Плевен,
    висше образование, специалност „Пожарна и аварийна безопасност“. Екземпляри: деловодство и Второ РУ – Плевен.

    ПОСТАНОВЛЕНИЕ рег. № 1234р-56789 от 17.11.2026 г. на ст. разследващ полицай Ана Борисова при Второ РУ – Плевен,
    по ЗМ № 123/2026 г. по описа на Второ РУ – Плевен и ДП № 1234/2026 г. по описа на РП – Плевен.
    Въпроси:
    1. По какъв начин са възникнали пожарите на 02.10.2026 и 08.10.2026 г. в землището на с. Габрово поле,
    обл. Плевен, в сухи треви, храсти и гора?
    2. Каква е причината за възникване на пожарите /касае ли се за умишлени действия или е възможно
    запалването да се дължи на технически неизправности, небрежност или действието на природни сили/?
    3. Ако се касае за умишлени действия, използвана ли е запалителна течност или други средства за
    улесняване на запалването и горенето?
    4. По възможност да бъдат определени огнищата на пожарите и дали е имало възможност пожарите да се
    разпространят върху съседни обекти?

    ТЕЛЕФОНОГРАМА № 532/02.10.2026 г.: в 15:53 ч. сигнал за пожар в суха трева в землището на с. Габрово поле.
    Екипът на РСПБЗН – Плевен пристига в 16:20 ч., гори площ 140 000 m²; в 16:55 ч. е изпратено подкрепление.
    Локализиран в 18:35 ч. на площ 200 000 m², ликвидиран в 20:05 ч.

    ТЕЛЕФОНОГРАМА № 549/08.10.2026 г.: в 11:40 ч. сигнал за пожар в сухи треви, храсти и гора в землището на
    с. Габрово поле. Екипът пристига в 12:10 ч., гори площ 300 000 m². Локализиран в 14:40 ч. на площ
    460 000 m², ликвидиран в 17:50 ч.; унищожени 460 дка широколистна гора.

    СПРАВКА по чл. 20, ал. 3 за пожара на 08.10.2026 г., изготвена след разговор с кмета на селото: при
    пристигането на екипа горят два горски пояса и стърнище на голяма нива; в края на единия пояс горенето е
    навлязло в гората. Причина: небрежност при боравене с открит огън.

    ПРОТОКОЛ ЗА РАЗПИТ на свидетеля Иван Кирилов от 03.11.2026 г.: наема пасище в местността „Бялата чешма“;
    на 02.10.2026 г. установил, че огънят започва откъм шосето и се придвижва на запад; изгорели около 36 дка
    от пасището. Не е видял хора край мястото.

    ПРОТОКОЛ ЗА РАЗПИТ на горския служител Петко Явор от 03.11.2026 г.: на 08.10.2026 г. горенето е дошло откъм
    землището на съседното село; при гасенето заварили земеделски производители с дискови брани да правят
    противопожарни ивици.

    КОНСТАТИВЕН ПРОТОКОЛ на ДГС от 12.10.2026 г.: в отдел 235 е преминал низов горски пожар на 57 дка
    държавна и 403 дка частна горска територия; насажденията са издънкови – дъб, акация, липа. Задържани
    документи и вещи – няма.

    Протокол за оглед на местопроизшествието в материалите няма. Веществени доказателства не са иззети.
graders:
  - name: docx-izgraden
    type: file_exists
    path: '**/Ekspertiza_*.docx'
  - name: ne-e-otkaz
    type: regex
    target: { source: file, path: report.md }
    # заключение, не писмо за отказ или искане на материали вместо отговори
    pattern: 'отказ(вам|ва|ът)? от изготвяне|не (е възможно|мога) да (бъде изготвено|изготвя)|невъзможност(та)? за изготвяне|материалите са недостатъчни за изготвяне'
    flags: i
    match: not_contains
  - name: otgovor-na-chetirite-vaprosa
    type: regex
    target: { source: file, path: report.md }
    pattern: 'Отговор на първи въпрос[\s\S]*Отговор на втори въпрос[\s\S]*Отговор на трети въпрос[\s\S]*Отговор на четвърти въпрос'
  - name: versiya-nebrezhnost
    type: regex
    target: { source: file, path: report.md }
    pattern: '[Нн]ебрежност'
  - name: uskoritelite-iskat-fiziko-himichna
    type: regex
    target: { source: file, path: report.md }
    # въпрос 3: без проби не може да се каже – казва се кое изследване би отговорило
    pattern: 'физико-химичн'
    flags: i
  - name: spomenava-lipsata-na-protokol
    type: regex
    target: { source: file, path: report.md }
    pattern: 'протокол за оглед'
    flags: i
  - name: bez-pravna-kvalifikatsiya
    type: regex
    target: { source: file, path: report.md }
    pattern: 'правна(та)? квалификация|Наказателния кодекс|\bНК\b|заподозр|извършител|палеж|умисъл'
    flags: i
    match: not_contains
