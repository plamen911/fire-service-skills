schema_version: "1.1"
name: eptz-zaklyuchenie-bez-oglet
description: >-
  ЕПТЗ за горял автомобил без протокол за оглед – липсата се пише като липса в материалите, не като
  пропуск на вещото лице, и изводът не надхвърля данните.
tags: [eptz, output]
runs: 1
execution:
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
  prompt: |
    Назначен съм за вещо лице. Измислен случай за тест – генерирай заключението направо, съгласен съм,
    не питай. Освен .docx запиши текста на заключението и в report.md в текущата папка.

    Експерт: Тодор Ясенов, ИНСПЕКТОР, инспектор в група „ОЦ“ на сектор „ПГ и СД“ при РДПБЗН – Плевен,
    висше образование, специалност „Пожарна и аварийна безопасност“. Екземпляри: деловодство и Първо РУ – Плевен.

    ПОСТАНОВЛЕНИЕ рег. № 1234р-56789 от 20.04.2026 г. на разследващ полицай Иван Петров при Първо РУ – Плевен,
    по ЗМ № 123/2026 г. по описа на Първо РУ – Плевен и ДП № 1234/2026 г. по описа на РП – Плевен.
    Въпроси: 1. Каква е причината за възникване на пожара в лекия автомобил? 2. Къде се е намирало
    огнището на пожара?

    ТЕЛЕФОНОГРАМА: На 18.04.2026 г. в 03:10 ч. е получен сигнал за горящ лек автомобил, паркиран на улица
    в гр. Плевен. Екипът на РСПБЗН – Плевен пристига в 03:18 ч., пожарът е локализиран в 03:25 ч. и ликвидиран в 03:35 ч.
    Изгорели са двигателният отсек и предната част на купето. Пострадали няма.

    ОБЯСНЕНИЯ: Собственикът Георги Дъбов паркирал колата около 22:00 ч. предната вечер; двигателят работел
    нормално, без светнали индикатори за неизправност. Съседът Петър Липов се събудил около 03:00 ч. от
    пукане и видял пламъци отпред под капака, от страната на шофьора.

    Снимки на пожарния екип (описание): най-силни термични поражения в предната лява част на двигателния
    отсек, гумата на предното ляво колело е изгоряла, задната част е само опушена.
    Протокол за оглед на местопроизшествието в материалите няма.
graders:
  - name: docx-izgraden
    type: file_exists
    path: '**/Ekspertiza_*.docx'
  - name: lipsata-na-oglet-kato-lipsa-v-materialite
    type: regex
    target: { source: file, path: report.md }
    pattern: 'оглед[а-я ]{0,40}не е извършен|не е извършен[а-я ]{0,40}оглед|поради липсата? на оглед'
    flags: i
    match: not_contains
  - name: spomenava-lipsata-na-protokol
    type: regex
    target: { source: file, path: report.md }
    pattern: 'протокол за оглед'
    flags: i
  - name: bez-pravna-kvalifikatsiya
    type: regex
    target: { source: file, path: report.md }
    pattern: 'правна(та)? квалификация|извън (моята )?компетентност|Наказателния кодекс|\bНК\b|заподозр|извършител'
    flags: i
    match: not_contains
  - name: ognishteto-v-dvigatelniya-otsek
    type: regex
    target: { source: file, path: report.md }
    pattern: 'Отговор на въпрос № 2:?[\s\S]{0,500}(двигателния|моторния) отсек'
  - name: predpazliv-izvod
    type: regex
    target: { source: file, path: report.md }
    # без протокол за оглед причината не се твърди категорично
    pattern: 'Обобщен отговор на въпрос № 1:?[\s\S]{0,900}(не може да бъде (потвърдена|установена)|не могат да бъдат изключени|не може да се установи|не може категорично)'
  - name: smislov-pregled-ot-podagent
    type: tool_used
    tool: Agent
