# Проверки с ИИ съдия върху целия report.md – пуска ги evals/sadiya.py, не plugin eval:
# неговият съдия отхвърля всеки дълъг документ. {materiali} – материалите от case.yaml дословно.
proverki:
  - name: bez-izmisleni-fakti
    criteria: |
      Материалите по този измислен случай са дадени по-долу дословно – това е всичко, което
      експертът знае за случая:
      <<<
      {materiali}
      >>>
      Позволени са: справочни стойности с позоваване на литература (маркер [[…]]); общи описания на
      механизми; пресмятания от числата в материалите (напр. минути между два часа); изводи,
      изрично представени като извод; „в материалите няма данни за …“; описанието на етапите на
      развитие на пожара в отговора за механизма (скрит период, тлеене, преход в пламъчно горене,
      разпространение по конструкцията), ако не противоречи на материалите – то е реконструкция
      на експерта. Конкретно твърдение какво е запалило определен предмет обаче е факт.
      PASS, ако всеки факт за конкретния случай в текста (дата, час, място, обект, предмет, площ,
      разстояние, следа, наблюдение, човек и какво е казал) го има в материалите.
      FAIL, ако текстът съдържа поне един факт за случая, който го няма в материалите, или извод
      на експерта, написан като установен факт (напр. какво е запалило какво, в какъв стадий е бил
      пожарът), без „най-вероятно“, „може да се приеме“ или подобно – цитирай го.
  - name: versiite-obosnovani-s-fakti
    criteria: |
      Материалите по случая, дословно – всичко, което експертът знае:
      <<<
      {materiali}
      >>>
      Това е експертно пожаро-техническо заключение по измислен случай: изгорял лек автомобил,
      паркиран на улицата около 5 часа преди пожара, без протокол за оглед; има само обяснения и
      описание на снимки (най-силни поражения в предната лява част на двигателния отсек).
      Оцени само разсъжденията в отговора на въпрос № 1.
      PASS, ако всяка разгледана версия е приета, отхвърлена или оставена отворена с конкретен факт
      от случая или с изрично посочване какви данни липсват, за да се провери (напр. протокол за оглед,
      оглед на ел. инсталацията), ако никоя версия не е отхвърлена категорично с факт, който в
      материалите го няма, и ако обобщеният отговор не обявява една причина за категорично
      установена.
      FAIL, ако някоя версия е отхвърлена или приета с измислен факт, ако изводът е категоричен
      въпреки липсата на оглед, или ако огнището в отговорите на въпроси № 1 и № 2 си противоречи –
      посочи къде.
