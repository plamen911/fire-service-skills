schema_version: "1.1"
name: eptz-zaklyuchenie-lyatna-kuhnya
description: >-
  Цялото ЕПТЗ по измислен случай с ясно огнище при комина – документът се изгражда, минава
  pregled.py и спазва правилата за съдържанието (версии А–Д, без правна квалификация, без бащино име,
  без надписи за ИИ, общ „Представен доказателствен материал“).
tags: [eptz, output]
runs: 1
execution:
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
  prompt: |
    Назначен съм за вещо лице. Измислен случай за тест – генерирай заключението направо, съгласен съм,
    не питай. Освен .docx запиши текста на заключението и в report.md в текущата папка.

    Експерт: Тодор Ясенов, ИНСПЕКТОР, инспектор в група „ОЦ“ на сектор „ПГ и СД“ при РДПБЗН – Плевен,
    висше образование, специалност „Пожарна и аварийна безопасност“. Екземпляри: деловодство и Първо РУ – Плевен.

    ПОСТАНОВЛЕНИЕ рег. № 1234р-56789 от 05.03.2026 г. на разследващ полицай Иван Петров при Първо РУ – Плевен,
    по ЗМ № 123/2026 г. по описа на Първо РУ – Плевен и ДП № 1234/2026 г. по описа на РП – Плевен.
    Въпроси: 1. Каква е причината за възникване на пожара? 2. Къде се е намирало огнището на пожара?
    3. Какъв е механизмът на развитие и разпространение на пожара?

    ТЕЛЕФОНОГРАМА: На 02.03.2026 г. в 18:40 ч. е получен сигнал за пожар в лятна кухня в двора на жилищен
    имот в с. Тестово, общ. Плевен. Екипът на РСПБЗН – Плевен пристига в 18:58 ч., пожарът е локализиран в 19:20 ч. и
    ликвидиран в 19:45 ч. Изгорели са покривната конструкция на кухнята (около 20 кв. м), маса, столове и
    около 1 куб. м дърва. Спасена е жилищната сграда на 6 м. Пострадали няма.

    ПРОТОКОЛ ЗА ОГЛЕД: Кухнята е с тухлени стени и дървена покривна конструкция с керемиди. В
    североизточния ъгъл има метална печка на твърдо гориво с ламаринен комин, преминаващ през дървения
    таван без изолация. Около комина гредите са изгорели напълно, овъгляването намалява към
    югозападната част, където гредите са само опушени. Дървата и вестниците на пода до печката не са
    горели – покрити са с паднали овъглени части от тавана. Автоматичните предпазители в жилищната сграда
    не са изключили; по проводниците в кухнята няма местни стопявания и перли.

    ОБЯСНЕНИЯ: Собственикът Стоян Брезов запалил печката около 16:30 ч., сложил дърва около 17:30 ч. и
    излязъл около 18:00 ч.; при връщането си в 18:35 ч. видял пушек от покрива. Съпругата му Мария Тополова
    казва, че тръбата минава през тавана без изолация и миналата зима таванът около нея бил почернял.
    Времето по данни на разследващия: тихо, без валежи, около 8 °C.
graders:
  - name: docx-izgraden
    type: file_exists
    path: '**/Ekspertiza_*.docx'
  - name: report-zapisan
    type: file_exists
    path: '**/report.md'
  - name: nezavisim-pregled
    type: tool_used
    tool: Bash
    input_match: 'pregled\.py'
  - name: versiya-d-nebrezhnost
    type: regex
    target: { source: file, path: report.md }
    pattern: 'Д\)\.?\s*\**\s*Небрежност'
    flags: i
  - name: bez-pravna-kvalifikatsiya
    type: regex
    target: { source: file, path: report.md }
    pattern: 'правна(та)? квалификация|извън (моята )?компетентност|Наказателния кодекс|\bНК\b|виновн'
    flags: i
    match: not_contains
  - name: bez-nadpis-ii
    type: regex
    target: { source: file, path: report.md }
    pattern: 'ЧЕРНОВА|изкуствен интелект|\bAI\b|Claude'
    match: not_contains
  - name: bez-bashtino-ime
    type: regex
    target: { source: file, path: report.md }
    pattern: '(Стоян|Мария|Иван|Тодор) [А-Я][а-я]+(ов|ев|ова|ева) [А-Я][а-я]+'
    match: not_contains
  - name: bez-izbroyavane-na-materialite
    type: regex
    target: { source: file, path: report.md }
    pattern: 'Представен доказателствен материал[^\n]*\n+[^\n]*(протокол за оглед|обяснения|телефонограма)'
    flags: i
    match: not_contains
  - name: sektsiya-i-do-polovin-stranitsa
    type: regex
    target: { source: file, path: report.md }
    # ≈ половин страница в шаблона – същата граница като SECTION_I_MAX в pregled.py
    pattern: '## I\. Обстоятелства по делото\.\s*\n[^#]{1,1900}\n## II'
  - name: otgovor-na-tri-vaprosa
    type: regex
    target: { source: file, path: report.md }
    pattern: 'Отговор на въпрос № 1[\s\S]+Отговор на въпрос № 2[\s\S]+Отговор на въпрос № 3'
  - name: ognishteto-pri-komina
    type: regex
    target: { source: file, path: report.md }
    pattern: 'Отговор на въпрос № 2:?[\s\S]{0,700}комин'
  - name: prichinata-e-kominat
    type: regex
    target: { source: file, path: report.md }
    pattern: 'Обобщен отговор на въпрос № 1:?[\s\S]{0,500}комин'
  - name: kasoto-otpada-s-dannite
    type: regex
    target: { source: file, path: report.md }
    pattern: 'Късо съединение[\s\S]{0,1200}предпазител[\s\S]{0,600}отпада'
  - name: smislov-pregled-ot-podagent
    type: tool_used
    tool: Agent
