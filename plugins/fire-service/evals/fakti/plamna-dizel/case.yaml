schema_version: "1.1"
name: fakti-plamna-dizel
description: Пламната температура на дизела е 52 °C по ICSC 1561 – числото и източникът.
tags: [fakti, regresiya]
runs: 3
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Каква е пламната температура на дизеловото гориво? Само числото и източника.
graders:
  - name: plamna-52
    type: regex
    pattern: '\b52\b'
    flags: i
  - name: icsc
    type: regex
    pattern: 'ICSC'
    flags: i
