schema_version: "1.1"
name: marshrut-vodoiztochnitsi
description: Къде има хидрант – водоизточници, не нормативна уредба.
tags: [marshrut, trigger, regresiya]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Покажи ми хидрантите в с. Тестово и кой е най-близо до училището.
graders:
  - name: zarezhda-vodoiztochnitsi
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vodoiztochnitsi"'
  - name: ne-zarezhda-normativna-uredba
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?normativna-uredba"'
    min: 0
    max: 0
