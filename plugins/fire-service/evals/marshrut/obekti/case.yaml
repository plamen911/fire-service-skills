schema_version: "1.1"
name: marshrut-obekti
description: Какво има за обект в регистъра – obekti, не shemi (схема не се чертае) и не vodoiztochnitsi.
tags: [marshrut, trigger, regresiya]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Какво имаме за обекта на ул. „Примерна“ в Плевен? Покажи ми схемата му и кой я е променял последно.
graders:
  - name: zarezhda-obekti
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?obekti"'
  - name: ne-zarezhda-shemi
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shemi"'
    min: 0
    max: 0
  - name: ne-zarezhda-vodoiztochnitsi
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vodoiztochnitsi"'
    min: 0
    max: 0
