schema_version: "1.1"
name: marshrut-situacionna-shema
description: Ситуационна схема на обект – shemi, не normativna-uredba и не plan-konspekt-ptz.
tags: [marshrut, trigger, regresiya]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Направи ми ситуационна схема на детска градина: сграда 40 на 14 м на два етажа, кухня 14 на 10 м, улица от юг с хидрант.
graders:
  - name: zarezhda-shemi
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shemi"'
  - name: ne-zarezhda-plan-konspekt-ptz
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-konspekt-ptz"'
    min: 0
    max: 0
