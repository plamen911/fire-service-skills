schema_version: "1.1"
name: marshrut-spravka-prichina
description: Изгасен пожар в МПС без дело – справка по чл. 20 ал. 3, не ЕПТЗ и не статистика.
tags: [marshrut, trigger, regresiya]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Снощи гасихме лек автомобил в с. Тестово – късо съединение под таблото, без пострадали.
    Направи ми справката за причината.
graders:
  - name: zarezhda-spravka-prichina
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spravka-prichina"'
  - name: ne-zarezhda-eptz
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eptz"'
    min: 0
    max: 0
  - name: ne-zarezhda-tarsene-proizshestviya
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tarsene-proizshestviya"'
    min: 0
    max: 0
