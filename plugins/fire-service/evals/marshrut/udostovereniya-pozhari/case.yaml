schema_version: "1.1"
name: marshrut-udostovereniya-pozhari
description: Удостоверение за застрахователя – не справка.
tags: [marshrut, trigger, regresiya]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Собственикът на колата, която изгоря миналата седмица в с. Тестово, иска удостоверение,
    че е имало пожар – за застрахователя. Можеш ли да го подготвиш?
graders:
  - name: zarezhda-udostovereniya-pozhari
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?udostovereniya-pozhari"'
  - name: ne-zarezhda-spravka-prichina
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spravka-prichina"'
    min: 0
    max: 0
