schema_version: "1.1"
name: marshrut-plan-konspekt-ptz
description: Пожаро-тактическо занятие на обект – plan-konspekt-ptz, не обикновен конспект.
tags: [marshrut, trigger, regresiya]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Подготви план-конспект за ПТЗ с дежурната смяна в склада за дървен материал в с. Тестово.
graders:
  - name: zarezhda-plan-konspekt-ptz
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-konspekt-ptz"'
  - name: ne-zarezhda-plan-konspekti
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-konspekti"'
    min: 0
    max: 0
